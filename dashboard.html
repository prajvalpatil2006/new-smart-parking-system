<!DOCTYPE html>
<html>
<head>
    <title>Smart Parking System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

<div class="main">
    <h1>Smart Parking System</h1>
    <div class="parking-area">
        <div class="slot occupied">
            🚗 <span>P1 Booked</span> <small>Free At 7:30 PM</small>
        </div>
        <div class="slot occupied">
            🚗 <span>P2 Booked</span> <small>Free At 8:00 PM</small>
        </div>
        <div class="slot occupied">
            🚗 <span>P3 Booked</span> <small>Free At 9:15 PM</small>
        </div>

        <div class="slot available" data-slot="4" onclick="bookSlot(this)">P4</div>
        <div class="slot available" data-slot="5" onclick="bookSlot(this)">P5</div>
        <div class="slot available" data-slot="6" onclick="bookSlot(this)">P6</div>
        <div class="slot available" data-slot="7" onclick="bookSlot(this)">P7</div>
        <div class="slot available" data-slot="8" onclick="bookSlot(this)">P8</div>
        <div class="slot available" data-slot="9" onclick="bookSlot(this)">P9</div>
        <div class="slot available" data-slot="10" onclick="bookSlot(this)">P10</div>
        <div class="slot available" data-slot="11" onclick="bookSlot(this)">P11</div>
        <div class="slot available" data-slot="12" onclick="bookSlot(this)">P12</div>
    </div>

    <h2 id="availableText">Available Slots : 9</h2>
    <h2 id="bookedText">Booked Slots : 3</h2>
</div>

<div id="paymentBox" class="payment-box">
    <div class="payment-content">
        <h2>Scan To Pay</h2>
        
        <div class="scanner-container">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=ParkingPayment" class="qr-image">
            <div class="scanner-line"></div>
        </div>
        
        <h3 id="feeText"></h3>
        
        <button onclick="completePayment()">Payment Done</button>
    </div>
</div>

<div id="notification" class="notification">
    ⚠ 15 Minutes Remaining <br> Please Empty The Parking Slot
</div>

<script>
let available = 9;
let booked = 3;
let currentSlot = null;

function bookSlot(slot){
    if($(slot).hasClass("occupied")){
        let remove = confirm("Do You Want To Unbook This Slot?");
        if(remove){
            unbookSlot(slot);
        }
    } else {
        let hours = prompt("Enter Parking Hours");
        if(hours == null || hours == ""){
            return;
        }

        let fee = hours * 20;
        let currentTime = new Date();
        let endTime = new Date(currentTime.getTime() + hours * 60 * 60 * 1000);
        let finalTime = endTime.toLocaleTimeString();

        currentSlot = slot;
        $("#feeText").html("Parking Fee : ₹" + fee);
        $(currentSlot).attr("data-fee", fee);
        $(currentSlot).attr("data-time", finalTime);
        
        // CSS display 'flex' केल्यामुळे पॉपअप उभ्या आणि आडव्या दोन्ही बाजूने सेंटरला येईल
        $("#paymentBox").css("display", "flex").hide().fadeIn();
    }
}

function completePayment(){
    let fee = $(currentSlot).attr("data-fee");
    let time = $(currentSlot).attr("data-time");
    let slotNumber = $(currentSlot).attr("data-slot");

    $(currentSlot).removeClass("available").addClass("occupied");
    $(currentSlot).html(
        "🚗" +
        "<span>P" + slotNumber + " Booked</span>" +
        "<small>₹" + fee + "</small>" +
        "<small>Free At " + time + "</small>"
    );

    available--;
    booked++;

    $("#availableText").html("Available Slots : " + available);
    $("#bookedText").html("Booked Slots : " + booked);
    $("#paymentBox").fadeOut();

    alert("🙏 Thanks For Booking");

    setTimeout(function(){
        $("#notification").fadeIn();
        setTimeout(function(){
            $("#notification").fadeOut();
        }, 5000);
    }, 5000);
}

function unbookSlot(slot){
    let slotNumber = $(slot).attr("data-slot");

    $(slot).removeClass("occupied").addClass("available");
    $(slot).html("P" + slotNumber);

    available++;
    booked--;

    $("#availableText").html("Available Slots : " + available);
    $("#bookedText").html("Booked Slots : " + booked);

    alert("✅ Slot Unbooked Successfully!\n💰 Your payment will be refunded to you in a few hours.");
}
</script>

</body>
</html>
